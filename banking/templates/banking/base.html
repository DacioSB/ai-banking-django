<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Bankflow{% endblock %}</title>
    <style>
        :root{
            --mdb-forest: #00684a;
            --mdb-leaf: #00ed64;
            --mdb-deep: #001e2b;
            --mdb-mint: #f3fcf7;
            --ink: #1f2933;
            --surface-soft: #f7faf9;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: var(--surface-soft); 
            color: var(--ink); 
            min-height: 100vh; 
        }
    </style>
    <body>
        <nav>
            <span>Bankflow</span>
            <a href="#">Documents</a>
            <a href="#">Upload</a>
            <a href="#">Tasks</a>
        </nav>
    </body>
</head>
</html>
