<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;family=Fira+Code:wght@400;500&amp;display=swap" rel="stylesheet">
    <title>{% block title %}Bankflow{% endblock %}</title>
    <style>
        :root{
            --mdb-forest: #00684a;
            --mdb-leaf: #00ed64;
            --mdb-deep: #001e2b;
            --mdb-mint: #f3fcf7;
            --ink: #1f2933;
            --surface-soft: #f7faf9;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: var(--surface-soft); 
            color: var(--ink); 
            min-height: 100vh; 
        }
        nav {
            background: var(--mdb-deep);
            padding: 0 2rem;
            display: flex;
            align-items: center;
            gap: 2rem;
            height: 56px;
            border-bottom: 3px solid var(--mdb-leaf);
        }
        nav a {
            text-decoration: none;
            color: #d9eee7;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 0.3rem 0.6rem;
            border-radius: 4px;
            transition: background .15s, color .15s;
        }
        nav a:hover, nav a.active {
            background: rgba(0, 237, 100, .13);
            color: #fff;
        }
        .nav-brand { 
            color: #fff; 
            font-weight: 700; 
            font-size: 1rem; 
            margin-right: auto; 
            letter-spacing: .3px; 
        }
        .container {
            max-width: 1100px;
            padding: 0 1.5rem;
            margin: 2rem auto;
        }
        .alert {
            padding: .75rem 1rem;
            margin-bottom: 1rem;
            border-radius: 6px;
            font-size: .9rem;
        }
        .alert-success {
            background: #d7f7df;
            color: var(--mdb-forest);
            border-left: 4px solid var(--mdb-leaf);
        }
    </style>
    <body>
        <nav>
            <span class="nav-brand">
                <i class="fa-solid fa-building-columns inspect-selected" style="color: #00ed64;"></i>
                Bankflow
            </span>
            <a href="#">Documents</a>
            <a href="#">Upload</a>
            <a href="#">Tasks</a>
        </nav>
        <div class="container">
            <div class="alert alert-success">SOME MESSAGE</div>
            {% for message in messages  %}
                <div class="alert alert-{{message.tag}}">{{message}}</div>
            {% endfor %}
            {% block content %}{% endblock %}
        </div>
    </body>
</head>
</html>
