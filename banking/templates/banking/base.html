<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Bankflow{% endblock %}</title>
    <style>
        :root{
            --mdb-forest: #00684a;
            --mdb-leaf: #00ed64;
            --mdb-deep: #001e2b;
            --mdb-mint: #f3fcf7;
            --ink: #1f2933;
            --surface-soft: #f7faf9;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: var(--surface-soft); 
            color: var(--ink); 
            min-height: 100vh; 
        }
        nav {
            background: var(--mdb-deep);
            padding: 0 2rem;
            display: flex;
            align-items: center;
            gap: 2rem;
            height: 56px;
            border-bottom: 3px solid var(--mdb-leaf);
        }
        nav a {
            text-decoration: none;
            color: #d9eee7;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 0.3rem 0.6rem;
            border-radius: 4px;
            transition: background .15s, color .15s;
        }
        nav a:hover, nav a.active {
            background: rgba(0, 237, 100, .13);
            color: #fff;
        }
        nav span {
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            margin-right: auto;
            letter-spacing: .3px;
        }
    </style>
    <body>
        <nav>
            <span>Bankflow</span>
            <a href="#">Documents</a>
            <a href="#">Upload</a>
            <a href="#">Tasks</a>
        </nav>
    </body>
</head>
</html>
